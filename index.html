<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security</title>
    <link rel="stylesheet" href="style.css">
    <style>
       
    </style>
</head>
<body>
 <div class="signup-container">
  <h2>Sign Up</h2>
  <form>
    <div class="input-group">
      <label>Email address</label>
      <input type="email" placeholder="placeholder@gmail.com" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="*********" required>
      <div class="password-strength" id="password-strength">
        <span id="strength-text">Password too weak!</span>
        <div class="strength-bar">
          <div id="strength-fill" class="strength-fill"></div>
        </div>
      </div>
    </div>
    <button type="submit" class="submit-btn">Create Account</button>
  </form>
</div>

<div id="issuebox">
  <h3 id="issue-reason"></h3>
  <p id="issue-description"></p>
  <img id="issue-image" alt="">
</div>

<div id="custom-overlay" class="overlay-backdrop">
  <div class="overlay-box">
    <h3>Alert </h3>
    <p> teksti ktu</p>
  </div>
</div>

<script src="source.js"></script>

</body>
</html>
